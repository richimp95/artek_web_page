name: Deploy a GitHub Pages (staging)

# Vista previa del rediseño. La producción real va por FTP a artekgt.com (ver ftp.yml).
on:
  push:
    branches: [redesign/astro]
  workflow_dispatch:

# Permisos para desplegar a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un solo despliegue concurrente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: pages # base=/artek_web_page/, site=github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        # Usa el package.json del repo; instala con npm y corre `astro build`.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
