name: Deploy a FTP (producción)

# Publica en artekgt.com al hacer push/merge a main.
# Credenciales en GitHub → Settings → Secrets and variables → Actions:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un solo deploy a la vez (evita subidas FTP simultáneas)
concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Solo desde main (bloquea workflow_dispatch lanzado desde otra rama).
    if: github.ref == 'refs/heads/main'
    # Gate de producción: configurar en Settings → Environments un entorno
    # "production" con required reviewers + deployment branch policy = main, y
    # mover ahí los secrets FTP_*. Así un deploy manual exige aprobación humana.
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build (producción → artekgt.com, base=/)
        run: npm run build
        env:
          DEPLOY_TARGET: ftp

      - name: Deploy vía FTP
        # Pineado a SHA (supply-chain): maneja secrets de producción.
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp # FTP plano (el hosting no soporta FTPS por ahora)
          local-dir: ./dist/
          server-dir: ./ # raíz donde aterriza el login (igual que en WinSCP)
          # Sync incremental: sube/actualiza solo lo cambiado. No borra archivos
          # ajenos (deja intactos correo, .htaccess, etc. del hosting).
